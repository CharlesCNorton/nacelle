[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nacelle"
version = "0.1.0"
description = "Spacetime engineering: designed in JAX, flown in GRTeclyn, proved in Rocq"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "jax>=0.12.0.1,<0.13",
    "numpy>=2.2",
    "scipy>=1.15",
    "sympy>=1.13",
]

[project.optional-dependencies]
test = ["pytest>=9"]
figure = ["matplotlib>=3.8"]

[project.scripts]
nacelle = "nacelle:main"

[tool.setuptools]
py-modules = ["nacelle"]

[tool.pytest.ini_options]
testpaths = ["nacelle.py"]
python_files = ["nacelle.py"]
markers = ["slow: a check of a minute or more, run with -m slow"]
addopts = "-m 'not slow'"
